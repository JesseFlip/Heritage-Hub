<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>HeritageHub — Organizer Guide / How to Add an Event</title>
<style>
  :root{--bg:#faf7f2;--surface:#fff;--surface2:#f4efe7;--text:#1c1917;--muted:#78716c;
    --border:#e7e1d6;--brand:#b91c1c;--brand2:#f97316;--accent:#7c3aed;--ok:#15803d;
    --shadow:0 1px 2px rgba(28,25,23,.06),0 10px 30px rgba(28,25,23,.10);}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans",Arial,sans-serif;
    background:var(--bg);color:var(--text);line-height:1.6;padding-bottom:60px}
  .wrap{max-width:760px;margin:0 auto;padding:0 18px}
  header.hero{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;
    padding:34px 0 28px;box-shadow:var(--shadow)}
  .brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px}
  .brand .logo{width:34px;height:34px;border-radius:10px;background:rgba(255,255,255,.2);
    display:grid;place-items:center;font-size:19px}
  h1{font-size:30px;font-weight:800;letter-spacing:-.02em;margin-top:16px;line-height:1.2}
  .sub{opacity:.95;margin-top:6px;font-size:16px;max-width:52ch}
  /* language bar */
  .langbar{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--bg) 92%,transparent);
    backdrop-filter:blur(10px);border-bottom:1px solid var(--border);padding:10px 0}
  .langpills{display:flex;gap:8px;overflow-x:auto;padding:0 18px;max-width:760px;margin:0 auto;
    scrollbar-width:none}
  .langpills::-webkit-scrollbar{display:none}
  .langpills button{white-space:nowrap;border:1px solid var(--border);background:var(--surface);
    color:var(--muted);font-weight:700;font-size:14px;padding:8px 14px;border-radius:999px;cursor:pointer}
  .langpills button.on{background:var(--brand);color:#fff;border-color:var(--brand)}
  /* steps */
  section{margin-top:26px}
  .steps{display:flex;flex-direction:column;gap:14px;margin-top:14px}
  .step{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:18px;
    display:flex;gap:16px;box-shadow:var(--shadow)}
  .step .num{flex-shrink:0;width:40px;height:40px;border-radius:12px;
    background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;font-weight:800;
    font-size:18px;display:grid;place-items:center}
  .step .emoji{font-size:22px}
  .step h3{font-size:17px;font-weight:750;margin-bottom:3px}
  .step p{color:var(--muted);font-size:15px}
  h2{font-size:20px;font-weight:800;margin-bottom:2px}
  .tips,.faqs{margin-top:14px;display:flex;flex-direction:column;gap:10px}
  .tip{background:var(--surface2);border-radius:12px;padding:13px 16px;font-size:15px;display:flex;gap:10px}
  .faq{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px 16px}
  .faq .q{font-weight:750;font-size:15px}
  .faq .a{color:var(--muted);font-size:14.5px;margin-top:3px}
  footer{margin-top:34px;padding-top:18px;border-top:1px solid var(--border);color:var(--muted);font-size:14px}
  .flag{font-size:16px}
  /* RTL */
  [dir="rtl"] .step{flex-direction:row}
  [dir="rtl"] .langpills{direction:rtl}
</style>
</head>
<body>
<header class="hero">
  <div class="wrap">
    <div class="brand"><span class="logo">🪷</span> HeritageHub</div>
    <h1 id="h-title">How to add your event</h1>

  </div>
</header>

<div class="langbar">
  <div class="langpills" id="langpills"></div>
</div>

<main class="wrap">

  <section>

  <section>

  </section>
  <footer id="footer"></footer>
</main>

function render(code){
  const d = C[code];
  const lang = LANGS.find(l=>l.code===code);
  document.documentElement.lang = code;
  document.documentElement.dir = lang.rtl ? "rtl" : "ltr";
  document.getElementById("h-title").textContent = d.title;
  document.getElementById("h-sub").textContent = d.sub;
  document.getElementById("steps").innerHTML = d.steps.map((s,i)=>`
    <div class="step">
      <div class="num">${i+1}</div>
      <div><h3><span class="emoji">${ICONS[i]}</span> ${s.t}</h3><p>${s.b}</p></div>
    </div>`).join("");
  document.getElementById("tips-title").textContent = d.tipsTitle;
  document.getElementById("tips").innerHTML = d.tips.map(t=>`<div class="tip"><span>💡</span><span>${t}</span></div>`).join("");
  document.getElementById("faq-title").textContent = d.faqTitle;
  document.getElementById("faqs").innerHTML = d.faqs.map(f=>`<div class="faq"><div class="q">${f.q}</div><div class="a">${f.a}</div></div>`).join("");
  document.getElementById("footer").textContent = d.footer;
  [...document.querySelectorAll(".langpills button")].forEach(b=>b.classList.toggle("on",b.dataset.c===code));
}

const bar = document.getElementById("langpills");
bar.innerHTML = LANGS.map(l=>`<button data-c="${l.code}"><span class="flag">${l.flag}</span> ${l.name}</button>`).join("");
[...bar.querySelectorAll("button")].forEach(b=>b.onclick=()=>render(b.dataset.c));
render("en");
</script>
